<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e7eef2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      try {
        var stored = localStorage.getItem('pillpath.theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
          var themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.setAttribute('content', '#12171c')
          var statusBar = document.querySelector(
            'meta[name="apple-mobile-web-app-status-bar-style"]',
          )
          if (statusBar) statusBar.setAttribute('content', 'black-translucent')
        } else {
          document.documentElement.style.colorScheme = 'light'
        }
      } catch (error) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="PillPath" />
    <meta
      name="description"
      content="A calm way to track daily and as-needed medication."
    />
    <title>PillPath</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
